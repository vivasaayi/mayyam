name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    paths:
      - '.github/workflows/docker-image.yml'
      - '.dockerignore'
      - 'Dockerfile'
      - 'Dockerfile.base'
      - 'docker-compose*.yml'
      - 'backend/**'
      - 'frontend/**'
      - 'docker/**'
      - 'scripts/validate-build-optimization.sh'
  workflow_dispatch:

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  COMPOSE_PROJECT_NAME: mayyam

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-compose:
    name: Docker Compose configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v5
    
    - name: Validate compose files
      run: |
        bash scripts/validate-build-optimization.sh
        docker compose --profile dev config >/dev/null
        docker compose --profile uat --profile test config >/dev/null

  build:
    name: Container build (${{ matrix.arch }})
    if: github.event_name != 'push'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
    - uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3.12.0

    - name: Build production container
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        platforms: ${{ matrix.platform }}
        push: false
        cache-from: type=gha,scope=mayyam-production-${{ matrix.arch }}
        cache-to: type=gha,mode=max,scope=mayyam-production-${{ matrix.arch }}

  publish:
    runs-on: ubuntu-latest
    needs: [validate-compose]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # We need permissions to write to packages
    permissions:
      contents: read
      packages: write
    
    steps:
    - uses: actions/checkout@v5

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3.12.0
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository_owner }}/mayyam
        tags: |
          type=sha
          type=ref,event=branch
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

    - name: Compute backend base image tag
      id: backend_base
      run: |
        LOCK_HASH="$(sha256sum backend/Cargo.toml backend/Cargo.lock backend/rust-toolchain.toml Dockerfile.base | sha256sum | awk '{print $1}')"
        echo "lock_hash=${LOCK_HASH}" >> "$GITHUB_OUTPUT"
        echo "registry_image=ghcr.io/${GITHUB_REPOSITORY_OWNER}/mayyam-backend-base:${LOCK_HASH}" >> "$GITHUB_OUTPUT"

    - name: Build and push backend base image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile.base
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.backend_base.outputs.registry_image }}
        cache-from: type=gha,scope=mayyam-backend-base
        cache-to: type=gha,mode=max,scope=mayyam-backend-base

    - name: Build and push production image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm64
        pull: true
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          BACKEND_BASE_IMAGE=${{ steps.backend_base.outputs.registry_image }}
        cache-from: type=gha,scope=mayyam-production
        cache-to: type=gha,mode=max,scope=mayyam-production
