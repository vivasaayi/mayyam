name: CI
env:
  ENABLE_INTEGRATION: ${{ secrets.ENABLE_INTEGRATION }}
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          # Keep in sync with backend/rust-toolchain.toml and Dockerfile RUST_VERSION.
          toolchain: "1.94"
          components: rustfmt, clippy
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
      - name: Run backend unit tests
        env:
          DATABASE_URL: "sqlite::memory:"
          RUST_LOG: "info"
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
        run: |
          cd backend
          cargo test --locked --lib
          cargo check --locked --bins

  frontend-tests:
    name: Frontend tests (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci --legacy-peer-deps --prefer-offline --no-audit --fund=false
      - name: Run unit tests
        run: cd frontend && CI=true npm test --silent -- --watchAll=false

  integration-tests:
    name: Integration tests (Docker Compose)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: [backend-tests, frontend-tests]
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up Docker Compose
        run: docker compose version
      - name: Install Amazon/utility tools
        run: sudo apt-get update && sudo apt-get -y install jq
      - name: Decide whether to run integration tests
        id: should_run_integration
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.ref }}" == "refs/heads/main" || "${{ env.ENABLE_INTEGRATION }}" == "true" ]]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi
      - name: Log in to GitHub Container Registry
        if: ${{ steps.should_run_integration.outputs.run == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend base image for CI
        if: ${{ steps.should_run_integration.outputs.run == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.base
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/mayyam-backend-base:latest
          cache-from: type=gha,scope=mayyam-backend-base
          cache-to: type=gha,mode=max,scope=mayyam-backend-base
      - name: Run integration tests stack
        if: ${{ steps.should_run_integration.outputs.run == 'true' }}
        env:
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        run: |
          chmod +x ./scripts/run-integration-tests.sh
          ./scripts/run-integration-tests.sh
      - name: Publish integration test logs
        if: ${{ always() && steps.should_run_integration.outputs.run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs
          path: backend/test-results
      - name: Publish integration compose logs
        if: ${{ always() && steps.should_run_integration.outputs.run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-compose-logs
          path: |
            docker-compose.integration.log
      - name: Upload integration test junit results
        if: ${{ always() && steps.should_run_integration.outputs.run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            backend/test-results/junit.xml

  e2e-tests:
    name: E2E (Playwright) tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: integration-tests
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright dependencies
        run: |
          cd frontend
          npm ci --legacy-peer-deps --prefer-offline --no-audit --fund=false
          npx playwright install --with-deps
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend base image for E2E
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.base
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/mayyam-backend-base:latest
          cache-from: type=gha,scope=mayyam-backend-base
          cache-to: type=gha,mode=max,scope=mayyam-backend-base
      - name: Start integration compose stack (frontend + backend)
        run: |
          docker compose --profile dev --profile test up -d backend-uat frontend-uat
      - name: Run Playwright tests
        env:
          API_URL: http://localhost:8080
        run: |
          mkdir -p frontend/playwright-report
          cd frontend
          CI=true npm run test:e2e -- --reporter=list
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/playwright-report/junit.xml
